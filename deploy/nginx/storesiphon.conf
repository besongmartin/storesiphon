# /etc/nginx/sites-available/storesiphon.conf  (Ubuntu 24.04, PHP 8.3-FPM)
# TLS certificates via certbot: sudo certbot --nginx -d storesiphon.com -d www.storesiphon.com

limit_req_zone $binary_remote_addr zone=ss_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ss_auth:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name storesiphon.com www.storesiphon.com;
    return 301 https://storesiphon.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.storesiphon.com;
    ssl_certificate     /etc/letsencrypt/live/storesiphon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storesiphon.com/privkey.pem;
    return 301 https://storesiphon.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name storesiphon.com;

    root /var/www/storesiphon/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 2m;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/storesiphon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storesiphon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Application sets CSP and the other security headers; HSTS is set here too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ /\.(?!well-known).* { return 404; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location /brand/ { expires 7d; try_files $uri =404; }

    location ~ ^/(login|register|forgot-password|two-factor-challenge) {
        limit_req zone=ss_auth burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        limit_req zone=ss_general burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }
}
