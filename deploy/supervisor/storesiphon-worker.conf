# /etc/supervisor/conf.d/storesiphon-worker.conf
# Payments first, then extractions. Restarted on every deploy by `php artisan queue:restart`.
[program:storesiphon-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/storesiphon/current/artisan queue:work redis --queue=payments,extractions,default --tries=1 --timeout=3600 --sleep=2 --max-time=14400
directory=/var/www/storesiphon/current
user=storesiphon
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3660
redirect_stderr=true
stdout_logfile=/var/www/storesiphon/shared/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
